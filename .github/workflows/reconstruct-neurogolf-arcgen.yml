name: Fetch NeuroGolf rules and discussions

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public Kaggle metadata and pages
        run: |
          mkdir -p pages
          set +e
          curl -L -A 'Mozilla/5.0' --retry 3 \
            https://www.kaggle.com/api/v1/competitions/view/neurogolf-2026 \
            -o pages/competition.json
          echo "competition_api=$?" > pages/status.txt
          curl -L -A 'Mozilla/5.0' --retry 3 \
            https://www.kaggle.com/competitions/neurogolf-2026/rules \
            -o pages/rules.html
          echo "rules_page=$?" >> pages/status.txt
          curl -L -A 'Mozilla/5.0' --retry 3 \
            https://www.kaggle.com/competitions/neurogolf-2026/discussion/724717 \
            -o pages/discussion_724717.html
          echo "discussion_724717=$?" >> pages/status.txt
          curl -L -A 'Mozilla/5.0' --retry 3 \
            https://www.kaggle.com/competitions/neurogolf-2026/discussion/724725 \
            -o pages/discussion_724725.html
          echo "discussion_724725=$?" >> pages/status.txt
          curl -L -A 'Mozilla/5.0' --retry 3 \
            https://www.kaggle.com/api/v1/datasets/view/zealous9230/neurogolf7300 \
            -o pages/dataset7300_metadata.json
          echo "dataset_metadata=$?" >> pages/status.txt
          wc -c pages/*
          set -e

      - name: Upload pages
        uses: actions/upload-artifact@v4
        with:
          name: neurogolf-rules-and-discussions
          path: pages/
          retention-days: 1
