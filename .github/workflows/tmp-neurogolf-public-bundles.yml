name: Temporary NeuroGolf 7300 dataset fetch

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download public Kaggle dataset
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifact/extracted
          curl -A 'Mozilla/5.0' -fL --retry 4 --retry-all-errors --connect-timeout 30 --max-time 900 \
            'https://www.kaggle.com/api/v1/datasets/download/zealous9230/neurogolf7300' \
            -o artifact/zealous9230_neurogolf7300.zip
          file artifact/zealous9230_neurogolf7300.zip
          unzip -t artifact/zealous9230_neurogolf7300.zip
          unzip -q artifact/zealous9230_neurogolf7300.zip -d artifact/extracted
          find artifact/extracted -type f -printf '%p %s bytes\n' | sort | tee artifact/inventory.txt
          find artifact/extracted -type f -name 'task*.onnx' | wc -l | tee artifact/model_count.txt
          sha256sum artifact/zealous9230_neurogolf7300.zip | tee artifact/sha256.txt

      - name: Upload public dataset
        uses: actions/upload-artifact@v4
        with:
          name: neurogolf-public-zealous7300-dataset
          path: artifact/
          compression-level: 0
          retention-days: 1
