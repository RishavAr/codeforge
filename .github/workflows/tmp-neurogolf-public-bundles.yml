name: Temporary NeuroGolf source export

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone and archive source builders
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/MinseongS/neurogolf.git repo
          rm -rf repo/.git
          find repo -maxdepth 3 -type f | sort | head -500
          zip -qr neurogolf-source-builders.zip repo
          sha256sum neurogolf-source-builders.zip

      - name: Upload source builders
        uses: actions/upload-artifact@v4
        with:
          name: neurogolf-source-builders
          path: neurogolf-source-builders.zip
          compression-level: 0
          retention-days: 1
