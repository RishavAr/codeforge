name: Temporary NeuroGolf public kernel index

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query-public-kernels:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Query Kaggle public kernel index
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p results
          cat > /tmp/query.py <<'PY'
          import json, pathlib, requests
          out = pathlib.Path('results')
          endpoint = 'https://api.kaggle.com/v1/kernels.KernelsApiService/ListKernels'
          headers = {'User-Agent':'Mozilla/5.0','Content-Type':'application/json'}
          queries = {
            'competition_recent_1': {'competition':'neurogolf-2026','page':1,'pageSize':100},
            'competition_recent_2': {'competition':'neurogolf-2026','page':2,'pageSize':100},
            'competition_recent_3': {'competition':'neurogolf-2026','page':3,'pageSize':100},
            'search_7281': {'competition':'neurogolf-2026','search':'7281','pageSize':100},
            'search_7330': {'competition':'neurogolf-2026','search':'7330','pageSize':100},
            'search_score': {'competition':'neurogolf-2026','search':'score','pageSize':100},
            'user_udit22': {'competition':'neurogolf-2026','user':'udit22','pageSize':100},
            'user_ryosuke': {'competition':'neurogolf-2026','user':'ryosuke','pageSize':100},
          }
          summary=[]
          for name,payload in queries.items():
            r=requests.post(endpoint,json=payload,headers=headers,timeout=120)
            (out/f'{name}.json').write_bytes(r.content)
            rec={'name':name,'status':r.status_code,'bytes':len(r.content)}
            try:
              data=r.json()
              rec['keys']=list(data) if isinstance(data,dict) else None
              items=(data.get('kernels') or data.get('items') or []) if isinstance(data,dict) else []
              rec['count']=len(items)
              rec['refs']=[]
              for item in items:
                ref=item.get('ref') or item.get('kernelRef') or item.get('id')
                title=item.get('title') or item.get('kernelTitle') or item.get('slug')
                rec['refs'].append({'ref':ref,'title':title})
            except Exception as e:
              rec['error']=repr(e)
              rec['text']=r.text[:500]
            summary.append(rec)
          (out/'summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
          python /tmp/query.py

      - name: Upload public kernel index
        uses: actions/upload-artifact@v4
        with:
          name: neurogolf-public-kernel-index
          path: results/
          compression-level: 0
          retention-days: 1
