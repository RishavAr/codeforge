name: NeuroGolf public scan

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Search high-score public NeuroGolf datasets
        shell: bash
        run: |
          set -e
          mkdir -p scan
          python -m pip install -q requests
          python - <<'PY'
          import requests, json, re
          searches=['neurogolf 8200','neurogolf 8190','neurogolf 8179','neurogolf 8100','neurogolf 8000','neurogolf 7900','neurogolf 7800','neurogolf points','neurogolf ultra']
          all_items={}
          for q in searches:
              r=requests.get('https://www.kaggle.com/api/v1/datasets/list',params={'search':q,'pageSize':100,'page':1,'sortBy':'updated'},timeout=90,headers={'User-Agent':'Mozilla/5.0'})
              open('scan/'+re.sub(r'[^a-z0-9]+','_',q.lower())+'.status','w').write(str(r.status_code)+'\n'+r.url+'\n'+r.text[:1000])
              if r.ok:
                  items=r.json()
                  json.dump(items,open('scan/'+re.sub(r'[^a-z0-9]+','_',q.lower())+'.json','w'),indent=2)
                  for x in items: all_items[x.get('ref')]=x
          rows=[]
          for ref,x in all_items.items():
              title=x.get('title','')
              nums=[int(n) for n in re.findall(r'(?<!\d)(7\d{3}|8\d{3}|9\d{3})(?!\d)',title)]
              rows.append({'ref':ref,'title':title,'lastUpdated':x.get('lastUpdated'),'bytes':x.get('totalBytes'),'numbers':nums,'url':x.get('url')})
          rows.sort(key=lambda x:(max(x['numbers'] or [0]),x.get('lastUpdated') or ''),reverse=True)
          json.dump(rows,open('scan/combined_ranked.json','w'),indent=2)
          for row in rows: print(row)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: neurogolf-highscore-search
          path: scan
