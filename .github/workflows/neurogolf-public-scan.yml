name: NeuroGolf public scan

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download high-score public NeuroGolf datasets
        shell: bash
        run: |
          set -e
          mkdir -p downloads
          python -m pip install -q requests
          python - <<'PY'
          import requests, pathlib, json
          refs = [
            'phixbugs/neurogolf-7860-points-v24',
            'deepxchat/neurogolf-ultra-promax-2026',
            'deepxchat/neurogolf-ultra-2026',
            'arman1o1/neurogolf-v7-submission',
            'haonanzhengh/neurogolf-v9-models',
          ]
          report=[]
          for ref in refs:
              name=ref.replace('/','__')
              url=f'https://www.kaggle.com/api/v1/datasets/download/{ref}'
              try:
                  r=requests.get(url,timeout=180,allow_redirects=True,headers={'User-Agent':'Mozilla/5.0'})
                  item={'ref':ref,'status':r.status_code,'url':r.url,'bytes':len(r.content),'content_type':r.headers.get('content-type')}
                  if r.ok and r.content[:2]==b'PK':
                      path=pathlib.Path('downloads')/(name+'.zip')
                      path.write_bytes(r.content)
                      item['saved']=str(path)
                  else:
                      pathlib.Path('downloads')/(name+'.txt')
                      open(f'downloads/{name}.txt','wb').write(r.content[:10000])
                  report.append(item)
                  print(item)
              except Exception as e:
                  report.append({'ref':ref,'error':repr(e)})
          json.dump(report,open('downloads/report.json','w'),indent=2)
          PY
          find downloads -maxdepth 1 -type f -printf '%f %s bytes\n'
      - uses: actions/upload-artifact@v4
        with:
          name: neurogolf-public-downloads
          path: downloads
